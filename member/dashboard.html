<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="IEEE Nile University — Member Dashboard" />
    <title>Dashboard | IEEE Nile University</title>
    <link rel="icon" type="image/x-icon" href="../assets/favicon.ico" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Merriweather+Sans:wght@400;500;600;700;800&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&display=swap" rel="stylesheet" />
    <link href="../css/styles.css" rel="stylesheet" />
</head>
<body>

    <div class="dashboard-wrapper">
        <!-- Sidebar Overlay (mobile) -->
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <!-- Sidebar -->
        <aside class="dash-sidebar" id="dashSidebar">
            <div class="sidebar-brand">
                <a href="../index.html">IEEE Nile University</a>
            </div>
            <nav class="sidebar-nav">
                <a class="dash-nav-item active" data-section="tasks" href="#">
                    <i class="bi bi-kanban"></i> Task Board
                </a>
                <a class="dash-nav-item" data-section="attendance" href="#">
                    <i class="bi bi-calendar-check"></i> Attendance
                </a>
                <a class="dash-nav-item" data-section="profile" href="#">
                    <i class="bi bi-person"></i> Profile
                </a>
                <a class="dash-nav-item" href="admin.html" id="adminNavLink" style="display: none;">
                    <i class="bi bi-shield-lock"></i> Admin Desk
                </a>
            </nav>
            <div class="sidebar-footer">
                <a class="dash-nav-item" href="#" id="logoutBtn" style="border-left: none; padding-left: 0;">
                    <i class="bi bi-box-arrow-left"></i> Sign Out
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <div class="dash-main">
            <!-- Top Bar -->
            <header class="dash-topbar">
                <div class="d-flex align-items-center gap-3">
                    <button class="sidebar-toggle" id="sidebarToggle">
                        <i class="bi bi-list"></i>
                    </button>
                    <span class="topbar-title" id="topbarTitle">Task Board</span>
                </div>
                <div class="topbar-user">
                    <span id="topbarUserName"></span>
                    <div class="user-avatar" id="topbarAvatar"></div>
                </div>
            </header>

            <div class="dash-content">

                <!-- ===== Tasks Section ===== -->
                <div class="dash-section active" id="section-tasks">
                    <!-- Stat Cards Row -->
                    <div class="row g-3 mb-4">
                        <div class="col-md-4">
                            <div class="dash-stat-card">
                                <div class="stat-icon blue"><i class="bi bi-list-task"></i></div>
                                <div class="stat-info">
                                    <h3 id="stat-todo">0</h3>
                                    <p>To Do</p>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="dash-stat-card">
                                <div class="stat-icon orange"><i class="bi bi-arrow-repeat"></i></div>
                                <div class="stat-info">
                                    <h3 id="stat-progress">0</h3>
                                    <p>In Progress</p>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="dash-stat-card">
                                <div class="stat-icon green"><i class="bi bi-check-circle"></i></div>
                                <div class="stat-info">
                                    <h3 id="stat-done">0</h3>
                                    <p>Completed</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Kanban Board -->
                    <div class="kanban-board" id="kanbanBoard">
                        <div class="kanban-column col-todo" data-status="ToDo">
                            <div class="kanban-column-header">
                                <h4>To Do</h4>
                                <span class="task-count" id="count-todo">0</span>
                            </div>
                            <div class="kanban-column-body" id="col-ToDo"></div>
                        </div>
                        <div class="kanban-column col-progress" data-status="InProgress">
                            <div class="kanban-column-header">
                                <h4>In Progress</h4>
                                <span class="task-count" id="count-progress">0</span>
                            </div>
                            <div class="kanban-column-body" id="col-InProgress"></div>
                        </div>
                        <div class="kanban-column col-done" data-status="Completed">
                            <div class="kanban-column-header">
                                <h4>Completed</h4>
                                <span class="task-count" id="count-done">0</span>
                            </div>
                            <div class="kanban-column-body" id="col-Completed"></div>
                        </div>
                    </div>
                    <div id="tasksFeedback" class="feedback-panel feedback-panel-light mt-3 text-center"></div>
                </div>

                <!-- ===== Attendance Section ===== -->
                <div class="dash-section" id="section-attendance">
                    <div class="row g-4">
                        <div class="col-lg-4">
                            <div class="attendance-card text-center">
                                <h4 style="font-size: 0.95rem; font-weight: 700; margin-bottom: 1.5rem; color: var(--ieee-dark);">Attendance Rate</h4>
                                <div class="gauge-container">
                                    <svg class="gauge-svg" viewBox="0 0 180 180">
                                        <circle class="gauge-bg" cx="90" cy="90" r="76" />
                                        <circle class="gauge-fill" id="gaugeFill" cx="90" cy="90" r="76"
                                                stroke-dasharray="477.52"
                                                stroke-dashoffset="477.52" />
                                        <g class="gauge-text-group">
                                            <text class="gauge-percent" x="90" y="85" id="gaugePercent">0%</text>
                                            <text class="gauge-label" x="90" y="106">Attendance</text>
                                        </g>
                                    </svg>
                                </div>
                                <div class="row text-center">
                                    <div class="col-6">
                                        <div style="font-family: var(--ieee-font-heading); font-size: 1.25rem; font-weight: 800; color: #28a745;" id="att-attended">0</div>
                                        <div style="font-size: 0.75rem; color: var(--ieee-secondary); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em;">Attended</div>
                                    </div>
                                    <div class="col-6">
                                        <div style="font-family: var(--ieee-font-heading); font-size: 1.25rem; font-weight: 800; color: #dc3545;" id="att-missed">0</div>
                                        <div style="font-size: 0.75rem; color: var(--ieee-secondary); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em;">Missed</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="col-lg-8">
                            <div class="attendance-card">
                                <h4 style="font-size: 0.95rem; font-weight: 700; margin-bottom: 1rem; color: var(--ieee-dark);">Attendance Log</h4>
                                <div class="attendance-log" id="attendanceLog">
                                    <div class="text-center text-muted py-4">Loading attendance data...</div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div id="attendanceFeedback" class="feedback-panel feedback-panel-light mt-3 text-center"></div>
                </div>

                <!-- ===== Profile Section ===== -->
                <div class="dash-section" id="section-profile">
                    <div class="row g-4 justify-content-center">
                        <div class="col-lg-5">
                            <div class="profile-card" id="profileCard">
                                <div class="profile-header">
                                    <div class="profile-avatar" id="profileAvatar"></div>
                                    <h3 id="profileName">Loading...</h3>
                                    <div class="profile-role" id="profileRole"></div>
                                    <button class="profile-edit-btn" id="profileEditToggle" title="Edit Profile"><i class="bi bi-pencil"></i></button>
                                </div>
                                <div class="profile-body" id="profileBody">
                                    <!-- Populated by JS -->
                                </div>
                                <!-- Profile Editor (hidden by default) -->
                                <div class="profile-editor" id="profileEditor">
                                    <div class="editor-title">Edit Profile</div>
                                    <form id="profileEditForm" novalidate>
                                        <!-- Avatar Upload -->
                                        <label class="avatar-upload-zone" id="avatarUploadZone">
                                            <div class="upload-preview" id="avatarPreview">
                                                <i class="bi bi-camera"></i>
                                            </div>
                                            <div class="upload-text">
                                                <strong>Upload Photo</strong><br/>Click to choose a profile picture
                                            </div>
                                            <input type="file" id="avatarFileInput" accept="image/*" style="display:none" />
                                        </label>
                                        <div class="mb-3">
                                            <label class="form-label" for="editPhone">Phone</label>
                                            <input type="tel" class="form-control" id="editPhone" maxlength="20" />
                                        </div>
                                        <div class="mb-3">
                                            <label class="form-label" for="editFaculty">Faculty</label>
                                            <select class="form-select" id="editFaculty">
                                                <option value="Computer Science">Computer Science</option>
                                                <option value="Engineering">Engineering</option>
                                                <option value="Business">Business</option>
                                                <option value="Biotechnology">Biotechnology</option>
                                                <option value="Other">Other</option>
                                            </select>
                                        </div>
                                        <div class="mb-3">
                                            <label class="form-label" for="editMajor">Major</label>
                                            <input type="text" class="form-control" id="editMajor" maxlength="100" />
                                        </div>
                                        <div class="mb-3">
                                            <label class="form-label" for="editAcademicYear">Academic Year</label>
                                            <select class="form-select" id="editAcademicYear">
                                                <option value="Freshman">Freshman</option>
                                                <option value="Sophomore">Sophomore</option>
                                                <option value="Junior">Junior</option>
                                                <option value="Senior">Senior</option>
                                            </select>
                                        </div>
                                        <div class="d-flex gap-2">
                                            <button type="submit" class="btn btn-ieee btn-ieee-primary flex-fill" id="profileSaveBtn" style="padding: 0.6rem; font-size: 0.82rem;">
                                                <span class="btn-text">Save Changes</span>
                                                <span class="btn-spinner"></span>
                                            </button>
                                            <button type="button" class="btn btn-ieee btn-ieee-outline flex-fill" id="profileCancelBtn" style="padding: 0.6rem; font-size: 0.82rem; color: var(--ieee-secondary); border-color: rgba(0,0,0,0.15);">Cancel</button>
                                        </div>
                                    </form>
                                    <div id="profileEditFeedback" class="feedback-panel feedback-panel-light mt-3 text-center"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/dashboard.js"></script>
</body>
</html>
