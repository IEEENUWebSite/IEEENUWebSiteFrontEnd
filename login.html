<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="IEEE Nile University Student Branch — Member Login" />
    <title>Member Login | IEEE Nile University</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Merriweather+Sans:wght@400;500;600;700;800&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&display=swap" rel="stylesheet" />
    <link href="css/styles.css" rel="stylesheet" />
</head>
<body>

    <div class="login-page">
        <div class="login-card">
            <div class="login-brand">
                <div class="brand-icon">
                    <i class="bi bi-shield-lock"></i>
                </div>
                <h1>Member Portal</h1>
                <p>Sign in with your IEEE member credentials</p>
            </div>

            <form id="loginForm" novalidate>
                <div class="form-floating mb-3">
                    <input type="email" class="form-control" id="loginEmail" placeholder="Email" required maxlength="100" autocomplete="email" />
                    <label for="loginEmail">Email Address</label>
                    <div class="validation-message" id="loginEmail-error"></div>
                </div>
                <div class="form-floating mb-4">
                    <input type="password" class="form-control" id="loginPassword" placeholder="Password" required autocomplete="current-password" />
                    <label for="loginPassword">Password</label>
                    <div class="validation-message" id="loginPassword-error"></div>
                </div>
                <button type="submit" class="btn btn-ieee btn-ieee-primary w-100" id="loginBtn" style="padding: 0.85rem; font-size: 0.9rem;">
                    <span class="btn-text">Sign In</span>
                    <span class="btn-spinner"></span>
                </button>
            </form>

            <div id="loginFeedback" class="feedback-panel mt-4 text-center"></div>

            <div class="text-center mt-4">
                <a href="index.html" style="color: rgba(255,255,255,0.4); font-size: 0.82rem; font-family: var(--ieee-font-heading); font-weight: 600;">
                    <i class="bi bi-arrow-left me-1"></i> Back to Home
                </a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
